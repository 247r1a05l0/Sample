<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SafeEvent - Register</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- Navigation -->

    <header>

        <h2>SafeEvent</h2>

        <nav>

            <a href="index.html">Home</a>

            <a href="events.html">Events</a>

            <a href="registration.html">My Registration</a>

            <a href="admin.html">Admin</a>

        </nav>

    </header>


    <!-- Registration Form -->

    <main class="register-page">

        <div class="register-container">

            <h1>Event Registration</h1>

            <p class="register-subtitle">
                Fill in your details to register for the event.
            </p>


            <form id="registrationForm">


                <!-- Full Name -->

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                    >

                    <small id="nameError"></small>

                </div>


                <!-- Email -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                    >

                    <small id="emailError"></small>

                </div>


                <!-- Phone -->

                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="text"
                        id="phone"
                        placeholder="Enter 10-digit phone number"
                        maxlength="10"
                    >

                    <small id="phoneError"></small>

                </div>


                <!-- College -->

                <div class="form-group">

                    <label for="college">
                        College
                    </label>

                    <input
                        type="text"
                        id="college"
                        placeholder="Enter your college name"
                    >

                    <small id="collegeError"></small>

                </div>


                <!-- Event -->

                <div class="form-group">

                    <label for="event">
                        Selected Event
                    </label>

                    <select id="event">

                        <option value="">
                            Select an event
                        </option>

                        <option value="Tech Fest 2026">
                            Tech Fest 2026
                        </option>

                        <option value="AI Hackathon">
                            AI Hackathon
                        </option>

                        <option value="Cultural Fest">
                            Cultural Fest
                        </option>

                        <option value="Sports Meet">
                            Sports Meet
                        </option>

                    </select>

                    <small id="eventError"></small>

                </div>


                <!-- Submit -->

                <button type="submit" class="register-button">

                    Register Now

                </button>


            </form>


            <!-- Success Message -->

            <div id="successMessage" class="success-message">

            </div>

        </div>

    </main>


    <!-- Footer -->

    <footer>

        <p>
            © 2026 SafeEvent | College Event Registration Platform
        </p>

    </footer>


    <script src="javascript/script.js"></script>

</body>

</html>
